<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 车载数据监控仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0b0e1a;
            color: #e0e6f0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dashboard {
            max-width: 1200px;
            width: 100%;
            background: linear-gradient(145deg, #131a2e, #1a2338);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a3a5a;
        }
        h1 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #8ab4f8;
            margin-bottom: 25px;
            border-left: 4px solid #4a7cf7;
            padding-left: 16px;
        }
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }
        .metric-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(74, 124, 247, 0.3);
        }
        .metric-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8899bb;
            margin-bottom: 6px;
        }
        .metric-value {
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .metric-value .unit {
            font-size: 18px;
            font-weight: 400;
            color: #8899bb;
            margin-left: 6px;
        }
        .speed-color {
            color: #4fc3f7;
        }
        .temp-color {
            color: #ff8a65;
        }
        .latency-color {
            color: #81c784;
        }
        .chart-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px 10px 10px 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 5px;
        }
        #chart {
            width: 100%;
            height: 320px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #445577;
            text-align: right;
            border-top: 1px solid #1a2338;
            padding-top: 15px;
        }
        .badge {
            display: inline-block;
            background: #1a2a44;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 11px;
            color: #6a8fc0;
            margin-left: 10px;
        }
        @media (max-width: 700px) {
            .metrics {
                grid-template-columns: 1fr;
            }
            .metric-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>
            🚗 实时车辆数据
            <span class="badge">LIVE</span>
        </h1>

        <div class="metrics">
            <div class="metric-card">
                <div class="metric-label">📊 当前车速</div>
                <div class="metric-value speed-color">
                    <span id="speedDisplay">--</span><span class="unit">km/h</span>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-label">🌡️ 发动机温度</div>
                <div class="metric-value temp-color">
                    <span id="tempDisplay">--</span><span class="unit">°C</span>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-label">⏱️ 数据延迟</div>
                <div class="metric-value latency-color">
                    <span id="latencyDisplay">--</span><span class="unit">ms</span>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div id="chart"></div>
        </div>
        <div class="footer">
            <span id="updateTime">--</span>  ·  数据源: C++ 模拟传感器 (1000Hz)
        </div>
    </div>

    <script>
        // ========== 初始化 ECharts ==========
        const chart = echarts.init(document.getElementById('chart'));

        // 图表配置（深色主题适配）
        const option = {
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(20,30,50,0.9)',
                borderColor: '#2a3a5a',
                textStyle: { color: '#e0e6f0' }
            },
            legend: {
                data: ['车速 (km/h)', '温度 (°C)'],
                textStyle: { color: '#8899bb' },
                top: 0,
                right: 10
            },
            grid: {
                left: 50,
                right: 30,
                bottom: 30,
                top: 40
            },
            xAxis: {
                type: 'category',
                data: [],
                axisLine: { lineStyle: { color: '#2a3a5a' } },
                axisLabel: { color: '#667799', fontSize: 11 },
                splitLine: { show: false }
            },
            yAxis: [{
                type: 'value',
                name: '车速 (km/h)',
                min: 0,
                max: 150,
                axisLabel: { color: '#667799' },
                splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
                axisLine: { show: false }
            }, {
                type: 'value',
                name: '温度 (°C)',
                min: 0,
                max: 100,
                axisLabel: { color: '#667799' },
                splitLine: { show: false },
                axisLine: { show: false }
            }],
            series: [{
                name: '车速 (km/h)',
                type: 'line',
                data: [],
                smooth: true,
                symbol: 'none',
                lineStyle: { color: '#4fc3f7', width: 2 },
                areaStyle: {
                    color: 'rgba(79, 195, 247, 0.15)'
                },
                yAxisIndex: 0
            }, {
                name: '温度 (°C)',
                type: 'line',
                data: [],
                smooth: true,
                symbol: 'none',
                lineStyle: { color: '#ff8a65', width: 2 },
                areaStyle: {
                    color: 'rgba(255, 138, 101, 0.12)'
                },
                yAxisIndex: 1
            }]
        };

        chart.setOption(option);

        // ========== 工具函数：格式化时间 ==========
        function formatTime(ts) {
            if (!ts || ts <= 0) return '--';
            const d = new Date(ts * 1000);
            return d.toLocaleTimeString('zh-CN', { hour12: false });
        }

        // ========== 核心刷新函数 ==========
        async function refreshDashboard() {
            const start = performance.now();

            try {
                // 1. 获取最新数据（用于大数字显示）
                const latestRes = await fetch('/api/latest');
                const latest = await latestRes.json();

                // 更新速度、温度
                document.getElementById('speedDisplay').innerText =
                    latest.speed !== undefined && latest.speed !== null ? latest.speed.toFixed(1) : '--';
                document.getElementById('tempDisplay').innerText =
                    latest.temp !== undefined && latest.temp !== null ? latest.temp.toFixed(1) : '--';

                // 更新时间戳
                if (latest.timestamp) {
                    document.getElementById('updateTime').innerText = '更新于: ' + formatTime(latest.timestamp);
                }

                // 2. 获取历史数据（用于曲线图）
                const historyRes = await fetch('/api/history');
                const historyData = await historyRes.json();

                // 准备图表数据
                const speedData = [];
                const tempData = [];
                const timeLabels = [];

                // 提取最近的数据（最多 100 个点，按时间顺序）
                const points = historyData.length > 0 ? historyData : [];
                for (let i = 0; i < points.length; i++) {
                    const item = points[i];
                    // 用索引作为 x 轴标签（更清晰），也可以显示具体时间
                    timeLabels.push((i + 1).toString());
                    speedData.push(item.speed || 0);
                    tempData.push(item.temp || 0);
                }

                // 更新 ECharts
                chart.setOption({
                    xAxis: { data: timeLabels },
                    series: [{
                        data: speedData
                    }, {
                        data: tempData
                    }]
                });

            } catch (e) {
                console.error('❌ 数据拉取失败:', e);
                // 不显示错误提示，避免闪烁
            }

            // 计算延迟
            const end = performance.now();
            const latency = (end - start).toFixed(0);
            document.getElementById('latencyDisplay').innerText = latency;
        }

        // ========== 启动定时刷新 ==========
        // 首次立即执行
        refreshDashboard();

        // 每 500ms 刷新一次（既保证实时性，又不给后端太大压力）
        setInterval(refreshDashboard, 500);
    </script>

</body>
</html>
